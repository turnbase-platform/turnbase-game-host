spring:
  application:
    name: turnbase-game-host
  # A shutdown phase may take the drain (turnbase.gamehost.drain-period) plus the gRPC server's own wait.
  lifecycle:
    timeout-per-shutdown-phase: 60s
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # session:{sessionId} (game-host-internals.md §8/§13). host+port, never url (IMP-GATE-77).
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

# No REST API — 9090 is the gRPC listener (GrpcServerLifecycle), bound separately below.
# server.port=-1 disables the main servlet container while leaving management its own,
# per Spring Boot's documented pattern for an actuator-only HTTP surface.
server:
  port: -1

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
    # Unset (all interfaces) in both profiles — local-environment.md §1 (IMP-GATE-14), same rule
    # turnbase-platform's 8081 follows. Compose restricts reachability by publishing the port to
    # 127.0.0.1 on the host, not by this app's own bind address — a published Docker port always
    # forwards to the container's bridge interface, never its loopback.
    address: ${MANAGEMENT_SERVER_ADDRESS:}
  endpoint:
    health:
      probes:
        enabled: true
    loggers:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,loggers
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}

# local-environment.md §7.8 — the whole Game Host tunable surface (IMP-M0-09), every default the
# one §7.8 states (grpc.port per IMP-GATE-17).
turnbase:
  gamehost:
    grpc:
      port: ${TURNBASE_GAMEHOST_GRPC_PORT:9090}
      max-message-size: ${TURNBASE_GAMEHOST_GRPC_MAX_MESSAGE_SIZE:32MB}
    handler-timeout: ${TURNBASE_GAMEHOST_HANDLER_TIMEOUT:30s}
    interrupt-escalation-grace: ${TURNBASE_GAMEHOST_INTERRUPT_ESCALATION_GRACE:5s}
    context-idle-eviction: ${TURNBASE_GAMEHOST_CONTEXT_IDLE_EVICTION:5m}
    memory-pressure-threshold: ${TURNBASE_GAMEHOST_MEMORY_PRESSURE_THRESHOLD:80%}
    redis-unavailable-window: ${TURNBASE_GAMEHOST_REDIS_UNAVAILABLE_WINDOW:60s}
    retry-limit: ${TURNBASE_GAMEHOST_RETRY_LIMIT:3}
    guest-java-home: ${TURNBASE_GAMEHOST_GUEST_JAVA_HOME:/opt/graalvm-guest-jdk21}
    orchestration-address: ${TURNBASE_GAMEHOST_ORCHESTRATION_ADDRESS:platform:8080}
    sdk-jar-path: ${TURNBASE_GAMEHOST_SDK_JAR_PATH:/opt/turnbase/guest-bridge.jar}
    artifact-cache-dir: ${TURNBASE_GAMEHOST_ARTIFACT_CACHE_DIR:/var/lib/turnbase/game-host/artifact-cache}
    artifact-cache-size-limit: ${TURNBASE_GAMEHOST_ARTIFACT_CACHE_SIZE_LIMIT:512MB}
    boot-timeout: ${TURNBASE_GAMEHOST_BOOT_TIMEOUT:20s}
    wedge-marker: ${TURNBASE_GAMEHOST_WEDGE_MARKER:/tmp/turnbase-wedged}
    drain-period: ${TURNBASE_GAMEHOST_DRAIN_PERIOD:30s}
    warmup-enabled: ${TURNBASE_GAMEHOST_WARMUP_ENABLED:false}
    max-concurrent-boots: ${TURNBASE_GAMEHOST_MAX_CONCURRENT_BOOTS:2}
    # advertised-address (env TURNBASE_GAMEHOST_ADVERTISED_ADDRESS) is absent by default: a
    # `${VAR:}` placeholder would bind "" rather than null. Relaxed binding reads the variable anyway.

  # local-environment.md §7.9 — shared with the monolith (secrets-and-configuration.md: one
  # credential, the monolith writes, this service only reads).
  artifact-store:
    endpoint: ${TURNBASE_ARTIFACT_STORE_ENDPOINT:http://minio:9000}
    bucket: ${TURNBASE_ARTIFACT_STORE_BUCKET:turnbase-bundles}
    access-key: ${TURNBASE_ARTIFACT_STORE_ACCESS_KEY}
    secret-key: ${TURNBASE_ARTIFACT_STORE_SECRET_KEY}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
