spring:
  application:
    name: turnbase-game-host
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

# No REST API — 9090 is the gRPC listener (GrpcServerLifecycle), bound separately below.
# server.port=-1 disables the main servlet container while leaving management its own,
# per Spring Boot's documented pattern for an actuator-only HTTP surface.
server:
  port: -1

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
    # Unset (all interfaces) in both profiles — local-environment.md §1 (IMP-GATE-14), same rule
    # turnbase-platform's 8081 follows. Compose restricts reachability by publishing the port to
    # 127.0.0.1 on the host, not by this app's own bind address — a published Docker port always
    # forwards to the container's bridge interface, never its loopback.
    address: ${MANAGEMENT_SERVER_ADDRESS:}
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# local-environment.md §7.8 — the whole Game Host tunable surface (IMP-M0-09), every default the
# one §7.8 states (grpc.port per IMP-GATE-17).
turnbase:
  gamehost:
    grpc:
      port: ${TURNBASE_GAMEHOST_GRPC_PORT:9090}
      max-message-size: ${TURNBASE_GAMEHOST_GRPC_MAX_MESSAGE_SIZE:32MB}
    handler-timeout: ${TURNBASE_GAMEHOST_HANDLER_TIMEOUT:30s}
    interrupt-escalation-grace: ${TURNBASE_GAMEHOST_INTERRUPT_ESCALATION_GRACE:5s}
    context-idle-eviction: ${TURNBASE_GAMEHOST_CONTEXT_IDLE_EVICTION:5m}
    memory-pressure-threshold: ${TURNBASE_GAMEHOST_MEMORY_PRESSURE_THRESHOLD:80%}
    redis-unavailable-window: ${TURNBASE_GAMEHOST_REDIS_UNAVAILABLE_WINDOW:60s}
    retry-limit: ${TURNBASE_GAMEHOST_RETRY_LIMIT:3}
    guest-java-home: ${TURNBASE_GAMEHOST_GUEST_JAVA_HOME:/opt/graalvm-guest-jdk21}
    orchestration-address: ${TURNBASE_GAMEHOST_ORCHESTRATION_ADDRESS:platform:8080}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
