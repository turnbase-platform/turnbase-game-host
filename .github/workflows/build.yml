# Build for turnbase-game-host.
#
# IMP-M0-04 stands up the build floor; IMP-M0-11 (the Trivy and GHCR-push steps below) owns
# the rest of the pipeline for all five repositories.
#
# master everywhere, never main (conventions.md §4).
name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        # ubuntu-latest ships with several multi-GB preinstalled toolchains this build never
        # uses (.NET, Android SDK, GHC, CodeQL). This module's image build plus Trivy's own ~1GB vuln DB
        # push the runner's disk past capacity without this — Trivy's image scan then fails
        # exporting the built image with "no space left on device", not a real vulnerability
        # finding. `|| true`: not every path exists on every runner image.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Supervisor test
        # docker/supervise.sh runs as PID 1 in the image and is the only thing that restarts a
        # wedged JVM (ADR-0018 §2). The test needs no JVM and no cluster: a fake `java` and a stub
        # HTTP server (IMP-M16-02).
        run: bash docker/test/supervise-test.sh

      - name: Set up GraalVM CE 21
        # NOT actions/setup-java: it has no graalvm-community distribution and fails with
        # "No supported distribution was found for input graalvm-community". Matches the
        # .sdkmanrc pin, so CI and a developer's shell run the same JDK.
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '21'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify
        # Spotless runs at validate, Error Prone and NullAway during compile, JaCoCo's
        # merged check at verify. -Pintegration runs the Testcontainers-backed *IT suite (a
        # real Redis) so the merge JaCoCo does at verify (conventions.md §3) has
        # integration-tier data to merge; without it the check runs on unit-only coverage and
        # fails open exactly as that section warns (see turnbase-platform's build.yml, which
        # already does this). ubuntu-latest ships Docker, so Testcontainers needs no extra
        # setup.
        run: ./mvnw --batch-mode --no-transfer-progress verify -Pintegration

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Trivy scan — dependencies
        # One scan per target (IMP-M20-13): every severity lands in one JSON result, which is
        # the report (summary below, artifact) and the gate (next step). platform-operations.md
        # FR-CICD-010: all findings are reported, only a critical one blocks the build.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: "LOW,MEDIUM,HIGH,CRITICAL"
          format: json
          output: trivy-deps.json
          exit-code: "0"

      - name: Trivy report and gate — dependencies
        run: |
          jq -r '[.Results[]? | .Target as $t | .Vulnerabilities[]? | {s: .Severity, t: $t, id: .VulnerabilityID, p: .PkgName, v: .InstalledVersion}]
            | group_by(.s) | map("\(.[0].s): \(length)") | .[]' trivy-deps.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? | select(.Severity=="CRITICAL")
            | "CRITICAL \(.VulnerabilityID) \(.PkgName)@\(.InstalledVersion) (\($t))"' trivy-deps.json
          test "$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-deps.json)" -eq 0

      - name: Build container image
        # The jar was already built by `./mvnw verify` above; the Dockerfile packages it
        # rather than rebuilding, so the image build never needs its own network access to Maven.
        run: docker build -t turnbase/game-host:ci .

      - name: Trivy scan — image
        # One scan per target (IMP-M20-13): every severity lands in one JSON result, which is
        # the report (summary below, artifact) and the gate (next step). platform-operations.md
        # FR-CICD-010: all findings are reported, only a critical one blocks the build.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: turnbase/game-host:ci
          severity: "LOW,MEDIUM,HIGH,CRITICAL"
          format: json
          output: trivy-image.json
          exit-code: "0"

      - name: Trivy report and gate — image
        run: |
          jq -r '[.Results[]? | .Target as $t | .Vulnerabilities[]? | {s: .Severity, t: $t, id: .VulnerabilityID, p: .PkgName, v: .InstalledVersion}]
            | group_by(.s) | map("\(.[0].s): \(length)") | .[]' trivy-image.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? | select(.Severity=="CRITICAL")
            | "CRITICAL \(.VulnerabilityID) \(.PkgName)@\(.InstalledVersion) (\($t))"' trivy-image.json
          test "$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-image.json)" -eq 0

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        # FR-CICD-006: tagged with the commit SHA, on every push to master.
        if: github.event_name == 'push'
        run: |
          docker tag turnbase/game-host:ci ghcr.io/turnbase-platform/game-host:${{ github.sha }}
          docker push ghcr.io/turnbase-platform/game-host:${{ github.sha }}

  # IMP-M21-03 (D7): the gitleaks CLI over the full history, pinned. Not gitleaks-action, which
  # needs a licence key for organisation repositories.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks — full history
        # The container runs as root over a runner-owned checkout, so git needs safe.directory.
        run: >-
          docker run --rm -v "$PWD:/repo" --entrypoint sh zricethezav/gitleaks:v8.28.0
          -c "git config --global --add safe.directory /repo &&
          gitleaks git --no-banner --redact --verbose /repo"
