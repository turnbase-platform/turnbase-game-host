# Build for turnbase-game-host.
#
# IMP-M0-04 stands up the build floor; IMP-M0-11 (the Trivy and GHCR-push steps below) owns
# the rest of the pipeline for all five repositories.
#
# master everywhere, never main (conventions.md §4).
name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        # ubuntu-latest ships with several multi-GB preinstalled toolchains this build never
        # uses (.NET, Android SDK, GHC, CodeQL). This module's image build + two bootstrap
        # installs (turnbase-common, turnbase-sdk, IMP-GATE-70) plus Trivy's own ~1GB vuln DB
        # push the runner's disk past capacity without this — Trivy's image scan then fails
        # exporting the built image with "no space left on device", not a real vulnerability
        # finding. `|| true`: not every path exists on every runner image.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Supervisor test
        # docker/supervise.sh runs as PID 1 in the image and is the only thing that restarts a
        # wedged JVM (ADR-0018 §2). The test needs no JVM and no cluster: a fake `java` and a stub
        # HTTP server (IMP-M16-02).
        run: bash docker/test/supervise-test.sh

      - name: Set up GraalVM CE 21
        # NOT actions/setup-java: it has no graalvm-community distribution and fails with
        # "No supported distribution was found for input graalvm-community". Matches the
        # .sdkmanrc pin, so CI and a developer's shell run the same JDK.
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '21'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install turnbase-common (bootstrap — conventions.md §5)
        # turnbase-common has no tagged release yet, so <turnbase-common.version> pins its
        # current development version and this runner needs it in the local repository.
        # turnbase-common is private (ADR-0012), so this needs a credential beyond the
        # workflow's own GITHUB_TOKEN — TURNBASE_COMMON_PAT is a fine-grained PAT, read-only
        # on Contents, scoped to turnbase-common only (a new secret on this repo — secrets
        # do not carry across repos). Delete this step, not adapt it, the same PR that bumps
        # the version property to a real release once IMP-M0-11 publishes one.
        env:
          TURNBASE_COMMON_PAT: ${{ secrets.TURNBASE_COMMON_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${TURNBASE_COMMON_PAT}@github.com/${{ github.repository_owner }}/turnbase-common.git" /tmp/turnbase-common
          cd /tmp/turnbase-common
          ./mvnw --batch-mode --no-transfer-progress install -DskipTests
          cd -
          rm -rf /tmp/turnbase-common

      - name: Install turnbase-sdk (bootstrap — conventions.md §5, IMP-GATE-70)
        # Same reasoning as turnbase-common above: turnbase-sdk has no tagged release yet,
        # so <turnbase-sdk.version> pins its current development version and this runner
        # needs it in the local repository. turnbase-sdk is private (ADR-0012), so this
        # needs TURNBASE_SDK_PAT — a fine-grained PAT, read-only on Contents, scoped to
        # turnbase-sdk only. Delete this step, not adapt it, the same PR that bumps the
        # version property to a real release once turnbase-sdk publishes one.
        env:
          TURNBASE_SDK_PAT: ${{ secrets.TURNBASE_SDK_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${TURNBASE_SDK_PAT}@github.com/${{ github.repository_owner }}/turnbase-sdk.git" /tmp/turnbase-sdk
          cd /tmp/turnbase-sdk
          ./mvnw --batch-mode --no-transfer-progress install -DskipTests
          cd -
          rm -rf /tmp/turnbase-sdk

      - name: Verify
        # Spotless runs at validate, Error Prone and NullAway during compile, JaCoCo's
        # merged check at verify. -Pintegration runs the Testcontainers-backed *IT suite (a
        # real Redis) so the merge JaCoCo does at verify (conventions.md §3) has
        # integration-tier data to merge; without it the check runs on unit-only coverage and
        # fails open exactly as that section warns (see turnbase-platform's build.yml, which
        # already does this). ubuntu-latest ships Docker, so Testcontainers needs no extra
        # setup.
        run: ./mvnw --batch-mode --no-transfer-progress verify -Pintegration

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Trivy scan — dependencies (report)
        # platform-operations.md FR-CICD-010: every finding is reported; only a critical one
        # blocks the build (the next step).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: Trivy scan — dependencies (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'

      - name: Build container image
        # The jar was already built by `./mvnw verify` above; the Dockerfile packages it
        # rather than rebuilding, so the image build never needs its own network access to
        # turnbase-common (conventions.md §5 bootstrap window, IMP-GATE-07).
        run: docker build -t turnbase/game-host:ci .

      - name: Trivy scan — image (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: turnbase/game-host:ci
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: Trivy scan — image (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: turnbase/game-host:ci
          severity: CRITICAL
          exit-code: '1'

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        # FR-CICD-006: tagged with the commit SHA, on every push to master.
        if: github.event_name == 'push'
        run: |
          docker tag turnbase/game-host:ci ghcr.io/turnbase-platform/game-host:${{ github.sha }}
          docker push ghcr.io/turnbase-platform/game-host:${{ github.sha }}
