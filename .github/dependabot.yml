# Supply-chain updates, per conventions.md §6 and platform-operations.md FR-CICD-010.
# Trivy scanning is wired by IMP-M0-11 with the rest of the shared pipeline; this file is
# the half that is pure configuration and therefore cheaper to land now than to remember
# later.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # CLAUDE.md pins Spring Boot 3.5+, not 4.x — a major bump is a deliberate upgrade
      # this project hasn't made, not a routine update (closed once already on
      # turnbase-platform, 2026-09-02).
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        versions: ['>=4.0.0']
      # There is no CE build for JDK 23+ (CLAUDE.md); an Espresso major bump is a
      # deliberate re-run of the spike, not a routine update.
      - dependency-name: org.graalvm.polyglot:*
        versions: ['>=24']
    groups:
      spring:
        patterns:
          - org.springframework.boot:*
      grpc:
        patterns:
          - io.grpc:*
      build-tooling:
        patterns:
          - com.diffplug.spotless:*
          - com.google.errorprone:*
          - com.uber.nullaway:*
          - org.jacoco:*
          - org.apache.maven.plugins:*
      test:
        patterns:
          - org.assertj:*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # No CE build exists for JDK 23+ (CLAUDE.md) — a major bump here is the same
      # deliberate-upgrade case as the Espresso artifacts above.
      - dependency-name: ghcr.io/graalvm/jdk-community
        versions: ['>=22']
    commit-message:
      prefix: chore
      include: scope
